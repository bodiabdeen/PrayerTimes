apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

def enableProguardInReleaseBuilds = false
def jscFlavor = 'org.webkit:android-jsc:+'

// Resolve full path to node so release bundle works from Android Studio (where PATH may not include node).
def getNodeExecutable() {
    def nodeEnv = System.getenv("NODE_BINARY")
    if (nodeEnv != null && !nodeEnv.isEmpty()) return nodeEnv.trim()
    try {
        def proc = ["/bin/sh", "-c", "command -v node 2>/dev/null || which node 2>/dev/null"].execute((String[]) null, project.rootDir)
        proc.waitFor()
        if (proc.exitValue() == 0) {
            def path = proc.text.trim()
            if (path) return path
        }
        // Login shell so nvm/fnm are in PATH (Android Studio often has minimal PATH)
        proc = ["/bin/sh", "-l", "-c", "command -v node 2>/dev/null"].execute((String[]) null, project.rootDir)
        proc.waitFor()
        if (proc.exitValue() == 0) {
            def path = proc.text.trim()
            if (path) return path
        }
    } catch (Exception ignored) {}
    for (path in ["/opt/homebrew/bin/node", "/usr/local/bin/node"]) {
        if (path && new File(path).exists()) return path
    }
    return "node"
}

react {
    /* Folders */
    root = file("../../")
    reactNativeDir = file("../../node_modules/react-native")
    codegenDir = file("../../node_modules/@react-native/codegen")
    cliFile = file("../../node_modules/react-native/cli.js")
    /* Node path for release bundle (fixes "command 'node'" when building from Android Studio) */
    nodeExecutableAndArgs = [getNodeExecutable()]
    autolinkLibrariesWithApp()
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.iomprayertimes"

    // Required for 16 KB memory page size support (Android 15+ / Google Play)
    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }

    defaultConfig {
        applicationId "com.iomprayertimes"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // VERSION UPDATE: 1.2 (Build 16)
        versionCode 16
        versionName "1.2"
        buildConfigField "boolean", "IS_NEW_ARCHITECTURE_ENABLED", (findProperty("newArchEnabled") ?: "true").toBoolean().toString()
        buildConfigField "boolean", "IS_HERMES_ENABLED", "(findProperty('hermesEnabled') ?: 'true').toBoolean()"
        ndk {
            abiFilters "arm64-v8a", "x86_64"
        }
    }
    
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.4'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.6.4'

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

apply plugin: 'com.google.gms.google-services'
